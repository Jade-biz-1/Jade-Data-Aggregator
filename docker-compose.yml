services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: dataaggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.4
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.4
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
      - ./temp:/app/temp
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dataaggregator

      # Redis Configuration
      - REDIS_URL=redis://redis:6379/0

      # Kafka Configuration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

      # CORS Configuration - Allows frontend to communicate with backend
      # For production, customize these origins to match your domain
      - BACKEND_CORS_ORIGINS=["http://localhost", "http://localhost:3000", "http://localhost:3001", "http://localhost:8001", "http://frontend:3000"]

      # Environment Setting - Controls user creation and other behaviors
      # Options: development, staging, production
      - ENVIRONMENT=development

      # User Creation Flags - Only for development/testing
      # CREATE_DEV_USER: Automatically creates 'dev' user (dev/dev12345) when true
      # Set to 'false' in production for security
      - CREATE_DEV_USER=true

      # Production Safeguard - Prevents Developer role in production
      # Keep as 'false' in production environments
      - ALLOW_DEV_ROLE_IN_PRODUCTION=false
 
      # File Storage Paths (Phase 9: Service Decoupling)
      - TEMP_FILES_PATH=/app/temp
      - UPLOAD_PATH=/app/uploads
      - LOG_PATH=/app/logs

      # Phase 9B: Email Service Configuration
      - EMAIL_HOST=mailhog
      - EMAIL_PORT=1025
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Backend API URL - Frontend uses this to communicate with backend
      # Must include /api/v1 path prefix
      NEXT_PUBLIC_API_URL: http://localhost:8001/api/v1
      # Show dev-only example data link in UI
      NEXT_PUBLIC_SHOW_EXAMPLE_DATA: "true"
    depends_on:
      - backend

volumes:
  postgres_data:
