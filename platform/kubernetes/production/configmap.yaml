apiVersion: v1
kind: ConfigMap
metadata:
  name: dataaggregator-config
  namespace: dataaggregator
  labels:
    app.kubernetes.io/name: data-aggregator
    environment: production
data:
  ENVIRONMENT: "production"
  POSTGRES_SERVER: "postgres.dataaggregator.svc.cluster.local"
  POSTGRES_USER: "dataaggregator"
  POSTGRES_DB: "dataaggregator_prod"
  REDIS_URL: "redis://redis-master.dataaggregator.svc.cluster.local:6379/0"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  MAX_LOGIN_ATTEMPTS: "5"
  LOCKOUT_DURATION: "15"
  NEXT_PUBLIC_API_URL: "https://dataaggregator.com/api/v1"
  NEXT_PUBLIC_ENVIRONMENT: "production"
